<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OhmNote account</title>
  <link rel="icon" href="img/icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav"><a class="brand" href="./"><img src="img/icon.png" alt=""><span>OhmNote</span></a>
  <nav><button id="lang" class="lang" aria-label="Language">HU</button></nav></header>
<main>
  <div class="account-card" id="card"><p class="muted" data-en="One moment…" data-hu="Egy pillanat…">One moment…</p></div>
</main>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
// Landing page for the links in OhmNote's emails: confirming a new account, and resetting a password.
'use strict';
let lang = localStorage.getItem('ohm-lang') || ((navigator.language || '').toLowerCase().startsWith('hu') ? 'hu' : 'en');
const T = {
  confirmed: ['Your email is confirmed. Go back to OhmNote and sign in.', 'Az e-mail-címed megerősítve. Menj vissza az OhmNote-ba, és jelentkezz be.'],
  newPass: ['Choose a new password', 'Új jelszó megadása'], pass: ['New password', 'Új jelszó'], save: ['Save password', 'Jelszó mentése'],
  saved: ['Password changed. You can sign in to OhmNote with it now.', 'A jelszó megváltozott. Most már bejelentkezhetsz vele az OhmNote-ba.'],
  short: ['Use at least 8 characters.', 'Legalább 8 karakter legyen.'],
  nothing: ['This page opens from the links in OhmNote’s emails. Nothing to do here right now.', 'Ez az oldal az OhmNote e-mailjeiben lévő linkekről nyílik meg. Most nincs itt teendő.'],
  off: ['Accounts are not set up for this site yet.', 'Ezen az oldalon még nincsenek beállítva a fiókok.'],
};
const L = (k) => T[k][lang === 'hu' ? 1 : 0];
const card = document.getElementById('card');
const show = (html) => { card.innerHTML = html; };
function applyLang() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-en]')) el.textContent = el.dataset[lang] || el.dataset.en;
  document.getElementById('lang').textContent = lang === 'hu' ? 'EN' : 'HU';
}
document.getElementById('lang').onclick = () => { lang = lang === 'hu' ? 'en' : 'hu'; localStorage.setItem('ohm-lang', lang); applyLang(); start(); };
applyLang();

async function start() {
  const cfg = window.OHM_CLOUD || {};
  if (!cfg.url || !cfg.anonKey) { show(`<p>${L('off')}</p>`); return; }
  const sb = supabase.createClient(cfg.url, cfg.anonKey, { auth: { detectSessionInUrl: true, persistSession: false, flowType: 'implicit' } });
  const hash = new URLSearchParams(location.hash.slice(1));
  const type = hash.get('type') || new URLSearchParams(location.search).get('type');
  await sb.auth.getSession();
  if (type === 'recovery') {
    show(`<h2>${L('newPass')}</h2><label><span>${L('pass')}</span><input type="password" id="pw" autocomplete="new-password"></label>
      <button class="btn primary" id="go">${L('save')}</button><p class="msg muted" id="msg"></p>`);
    document.getElementById('go').onclick = async () => {
      const pw = document.getElementById('pw').value, msg = document.getElementById('msg');
      if (pw.length < 8) { msg.textContent = L('short'); return; }
      const { error } = await sb.auth.updateUser({ password: pw });
      msg.textContent = error ? error.message : L('saved');
    };
  } else if (type === 'signup' || type === 'email' || hash.get('access_token')) {
    show(`<h2>✓</h2><p>${L('confirmed')}</p>`);
  } else if (hash.get('error_description')) {
    show(`<p>${hash.get('error_description')}</p>`);
  } else {
    show(`<p>${L('nothing')}</p>`);
  }
}
start();
</script>
</body>
</html>
