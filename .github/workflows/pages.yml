# Publishes the website (website/) to GitHub Pages whenever it changes on main.
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'src/cloud-config.js', 'src/vendor/supabase.js', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the app's account settings and Supabase client on the site
        run: cp src/cloud-config.js website/config.js && cp src/vendor/supabase.js website/supabase.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: website }
      - id: deployment
        uses: actions/deploy-pages@v4
