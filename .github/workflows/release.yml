# Builds every download and publishes them as a GitHub release when a version tag (v1.2.3) is pushed.
# Can also be started by hand from the Actions tab (it then only uploads the builds as artifacts).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Packaging tools (rpm, pacman)
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npx electron-builder --linux deb rpm pacman AppImage --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # GitHub's Ubuntu machines already have the Android SDK ($ANDROID_HOME); Gradle fetches any missing platform.
      - run: npm ci
      # The signing key lives in repository secrets, never in the code. Without it the build is
      # debug-signed (still installable, but updates need the same key, so add the secrets early).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ohmnote.jks"
            echo "OHM_KEYSTORE=$RUNNER_TEMP/ohmnote.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          OHM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OHM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OHM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          if [ -n "$OHM_KEYSTORE" ]; then node scripts/android-build.js release; else node scripts/android-build.js debug; fi
          cd dist && for f in OhmNote-*.apk; do mv "$f" "$(echo "$f" | sed 's/-debug//')" 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
